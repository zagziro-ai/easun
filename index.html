<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EASUN">
<meta name="theme-color" content="#06090e">
<title>EASUN</title>
<!--
  Сторінка віддаленого перегляду монітора EASUN (прошивка v12+; діагностика — v13+; графік за добу — v18+; керування за ПІН — v22+).
  Підключається до публічного MQTT-брокера через WebSocket, просить у ESP її головну сторінку
  і показує її, підставляючи дані, що приходять через брокер. Усе зашифровано AES-128-GCM ключем
  з посилання (частина після #) — ця частина адреси не відправляється на сервер.
  Сторінка однакова для всіх: свого в ній нічого немає, тож її можна класти куди завгодно (GitHub Pages тощо).
-->
<style>
:root{--bg:#06090e;--card:#0f1724;--fg:#e6f1ff;--mut:#7d8fa6;--line:#24384d;--bad:#ff3b5c;--acc:#22d3ee;color-scheme:dark}
@media(prefers-color-scheme:dark){:root{--bg:#0d0f13;--card:#161a21;--fg:#e5e7eb;--mut:#9ca3af;--line:#2a313c;--bad:#f87171;--acc:#60a5fa}}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#f{position:fixed;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
#msg{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
#msg .box{max-width:420px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px}
#msg h1{font-size:18px;margin:0 0 8px;font-weight:650}#msg p{margin:0;color:var(--mut);font-size:14px}
.spin{width:22px;height:22px;border:3px solid var(--line);border-top-color:var(--acc);border-radius:50%;margin:0 auto 12px;animation:r 1s linear infinite}
@keyframes r{to{transform:rotate(360deg)}}
#bar{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);display:none;max-width:calc(100% - 32px);
background:var(--card);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:7px 14px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar.bad{color:var(--bad)}
#bar small{display:block;color:var(--mut);font-size:11.5px;white-space:normal;margin-top:2px}
#bar.diag{border-radius:14px;white-space:normal;text-align:center}
#pin{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:24px;background:rgba(0,0,0,.6);z-index:10}
#pin .box{width:100%;max-width:340px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px 18px}
#pin h1{font-size:17px;margin:0 0 6px}#pin p{margin:0 0 12px;color:var(--mut);font-size:13.5px}
#pin input[type=password]{width:100%;font-size:24px;letter-spacing:.4em;text-align:center;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
#pin label{display:flex;gap:8px;align-items:center;font-size:13.5px;color:var(--mut);margin:12px 0}
#pin .bt{display:flex;gap:8px}#pin button{flex:1;padding:11px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--fg);font:inherit;cursor:pointer}
#pin button.pri{background:var(--acc);border-color:var(--acc);color:#031015;font-weight:600}#pin .err{color:var(--bad);font-size:13px;min-height:18px;margin-top:8px}
#lock{position:fixed;right:12px;top:calc(10px + env(safe-area-inset-top));display:none;z-index:6;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 11px;font-size:12.5px;color:var(--fg);cursor:pointer}
</style>
</head>
<body>
<iframe id="f" title="EASUN"></iframe>
<div id="msg"><div class="box"><div class="spin"></div><h1 id="mt"></h1><p id="mp"></p></div></div>
<div id="bar"></div>
<div id="lock"></div>
<div id="pin"><div class="box"><h1 id="pt"></h1><p id="pp"></p>
<input type="password" id="pv" inputmode="numeric" pattern="[0-9]*" maxlength="8" autocomplete="off">
<label><input type="checkbox" id="pr"> <span id="prl"></span></label>
<div class="bt"><button id="pc"></button><button class="pri" id="po"></button></div><div class="err" id="pe"></div></div></div>
<script>
// ── Підписи ──
const T = {
  connecting: "Підключаюся…",
  connectingP: "З'єднання з хмарою",
  waiting: "Чекаю на монітор…",
  waitingP: "Монітор має бути увімкнений і мати інтернет",
  noLink: "Потрібне посилання",
  noLinkP: "Відкрий посилання з налаштувань монітора (розділ «Віддалений доступ») або з команди /link у Telegram.",
  noCrypto: "Браузер не підтримує шифрування",
  noCryptoP: "Відкрий сторінку в Safari або Chrome за адресою https://…",
  offline: "Монітор не відповідає",
  offlineLong: "Монітор не відповідає вже {t}",
  noNet: "Немає з'єднання з хмарою — пробую ще",
  localOnly: "Це доступно лише вдома, у мережі монітора",
  pinTitle: "ПІН для керування",
  pinText: "Введи ПІН, щоб змінювати налаштування монітора віддалено. Задається вдома: Налаштування → Віддалений доступ.",
  pinRemember: "Запам'ятати на цьому пристрої",
  pinOk: "Відкрити", pinCancel: "Скасувати", pinWrong: "Неправильний ПІН (або монітор не відповідає)", pinChecking: "Перевіряю…",
  pinBad: "ПІН — від 4 до 8 цифр", pinNone: "Керування за ПІН не ввімкнено. Вдома: Налаштування → Віддалений доступ → ПІН.",
  unlocked: "🔓 Керування", lockAsk: "Вийти з керування на цьому пристрої?", needPin: "Щоб змінювати налаштування, відкрий їх (⚙) і введи ПІН",
  sec: "с", min: "хв", hr: "год",
  diag: "Діагностика", dCloud: "хмара", dSelf: "свій запит повернувся", dEsp: "сигнал від плати",
  dResp: "відповідей", dBad: "нерозшифровано", yes: "✓", no: "✗",
  dHint: "Плата шле сигнал, коли підключається до хмари. Немає сигналу — перезапусти плату, коли ця сторінка відкрита."
};
const DEF_WSS = "wss://broker.hivemq.com:8884/mqtt";
const STATE_STALE_MS = 15000;   // стан старший за це — монітор «не відповідає»

const $ = id => document.getElementById(id);
function showMsg(t, p, spin) {
  $('mt').textContent = t; $('mp').textContent = p || '';
  $('msg').querySelector('.spin').style.display = spin ? '' : 'none';
  $('msg').style.display = 'flex';
}
function bar(t, bad, sub) {
  const b = $('bar'); b.textContent = t || ''; b.className = (bad ? 'bad' : '') + (sub ? ' diag' : '');
  if (sub) { const s = document.createElement('small'); s.textContent = sub; b.appendChild(s); }
  b.style.display = t ? 'block' : 'none';
}
const D = {self: false, esp: false, rx: 0, bad: 0};
function diagText() {
  const f = v => v ? T.yes : T.no;
  return T.diag + ': ' + T.dCloud + ' ' + f(mq && mq.up) + ' · ' + T.dSelf + ' ' + f(D.self) + ' · ' + T.dEsp + ' ' + f(D.esp) +
    ' · ' + T.dResp + ' ' + D.rx + (D.bad ? ' · ' + T.dBad + ' ' + D.bad : '') + (D.esp ? '' : '. ' + T.dHint);
}
let toastT = 0;
function toast(t) { bar(t); clearTimeout(toastT); toastT = setTimeout(updBar, 3500); }

// ── Параметри з посилання (#d=…&k=…&w=…); запам'ятовуються, щоб працював ярлик на екрані «Додому» ──
function params() {
  const h = new URLSearchParams(location.hash.slice(1));
  let d = h.get('d'), k = h.get('k'), w = h.get('w');
  try {
    if (d && k) localStorage.setItem('easun_link', JSON.stringify({d, k, w}));
    else { const s = JSON.parse(localStorage.getItem('easun_link') || 'null'); if (s) ({d, k, w} = s); }
  } catch (e) {}
  if (d && k && !location.hash) try { history.replaceState(null, '', '#d=' + d + '&k=' + k + (w ? '&w=' + w : '')); } catch (e) {}
  return d && k ? {d, k, w: w || DEF_WSS} : null;
}
function b64urlDec(s) {
  s = s.replace(/-/g, '+').replace(/_/g, '/');
  while (s.length % 4) s += '=';
  const b = atob(s), u = new Uint8Array(b.length);
  for (let i = 0; i < b.length; i++) u[i] = b.charCodeAt(i);
  return u;
}

// ── Мінімальний клієнт MQTT 3.1.1 поверх WebSocket (QoS 0) ──
const enc = new TextEncoder(), dec = new TextDecoder();
function cat(...a) { const n = a.reduce((s, x) => s + x.length, 0), r = new Uint8Array(n); let o = 0; for (const x of a) { r.set(x, o); o += x.length; } return r; }
function mstr(s) { const b = enc.encode(s); return cat(new Uint8Array([b.length >> 8, b.length & 255]), b); }
function packet(h, body) {
  const len = []; let n = body.length;
  do { let d = n % 128; n = Math.floor(n / 128); if (n) d |= 128; len.push(d); } while (n);
  return cat(new Uint8Array([h]), new Uint8Array(len), body);
}
class Mqtt {
  constructor(url, topics, onMsg, onUp) { this.url = url; this.topics = topics; this.onMsg = onMsg; this.onUp = onUp; this.up = false; this.wait = 1000; this.connect(); }
  connect() {
    clearTimeout(this.rt);
    let ws;
    try { ws = new WebSocket(this.url, 'mqtt'); } catch (e) { this.retry(); return; }
    this.ws = ws; ws.binaryType = 'arraybuffer'; this.buf = new Uint8Array(0);
    ws.onopen = () => {
      const id = 'easun-v-' + Math.random().toString(36).slice(2, 10);
      ws.send(packet(0x10, cat(mstr('MQTT'), new Uint8Array([4, 2, 0, 60]), mstr(id))));
    };
    ws.onmessage = e => { this.buf = cat(this.buf, new Uint8Array(e.data)); this.parse(); };
    ws.onclose = () => { if (this.ws !== ws) return; this.setUp(false); clearInterval(this.pt); this.retry(); };
    ws.onerror = () => { try { ws.close(); } catch (e) {} };
  }
  retry() { this.rt = setTimeout(() => this.connect(), this.wait); this.wait = Math.min(this.wait * 2, 20000); }
  setUp(v) { if (this.up !== v) { this.up = v; this.onUp(v); } }
  parse() {
    for (;;) {
      const b = this.buf; if (b.length < 2) return;
      let mul = 1, len = 0, i = 1, d;
      do { if (i >= b.length) return; d = b[i++]; len += (d & 127) * mul; mul *= 128; } while (d & 128);
      if (b.length < i + len) return;
      const type = b[0] >> 4, p = b.subarray(i, i + len);
      this.buf = b.slice(i + len);
      if (type === 2) {                           // CONNACK
        if (p[1] !== 0) { this.ws.close(); return; }
        this.wait = 1000;
        this.ws.send(packet(0x82, cat(new Uint8Array([0, 1]), ...this.topics.map(t => cat(mstr(t), new Uint8Array([0]))))));
        clearInterval(this.pt); this.pt = setInterval(() => this.ws.readyState === 1 && this.ws.send(new Uint8Array([0xC0, 0])), 30000);
      } else if (type === 9) this.setUp(true);   // SUBACK
      else if (type === 3) {                      // PUBLISH
        const qos = (b[0] >> 1) & 3, tl = (p[0] << 8) | p[1];
        let o = 2 + tl; if (qos) o += 2;
        this.onMsg(dec.decode(p.subarray(2, 2 + tl)), p.slice(o));
      }
    }
  }
  pub(topic, payload) { if (this.ws && this.ws.readyState === 1) this.ws.send(packet(0x30, cat(mstr(topic), payload))); }
  kick() { if (!this.ws || this.ws.readyState > 1) { this.wait = 1000; this.connect(); } }
}

// ── Логіка перегляду ──
const P = params();
let key, mq, state = null, stateAt = 0, curPage = null, shownHtml = '', rx = {}, waiters = {};
const RB = window.RB = {};   // міст для сторінки в рамці

async function encReq(c) {
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const pt = new Uint8Array(9); pt[0] = c.charCodeAt(0);
  new DataView(pt.buffer).setFloat64(1, Date.now());
  const ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, key, pt));
  return cat(iv, ct);
}
async function req(c) { if (mq && mq.up) mq.pub('easun/' + P.d + '/q', await encReq(c)); }

async function onMsg(topic, data) {
  const isQ = topic.endsWith('/q');
  if (data.length < 12 + 1 + 16) return;
  let pt;
  try { pt = new Uint8Array(await crypto.subtle.decrypt({name: 'AES-GCM', iv: data.subarray(0, 12)}, key, data.subarray(12))); }
  catch (e) {
    if (isQ || !ck) { if (!isQ) D.bad++; return; }
    try { pt = new Uint8Array(await crypto.subtle.decrypt({name: 'AES-GCM', iv: data.subarray(0, 12)}, ck, data.subarray(12))); }   // відповідь керування
    catch (e2) { D.bad++; return; }
  }
  if (isQ) {                                        // тема запитів: наші ж запити і перевірка від плати
    if (pt[0] === 69) D.esp = true; else D.self = true;   // 'E' — плата щойно підключилася
    return;
  }
  D.rx++; D.esp = true;
  const type = String.fromCharCode(pt[0]), sq = (pt[1] << 8) | pt[2], seq = sq & 0x7FFF, last = !!(sq & 0x8000);
  let r = rx[type];
  if (seq === 0) r = rx[type] = {n: 0, parts: []};
  if (!r || r.n !== seq) { delete rx[type]; return; }   // загубився шматок — чекаємо наступну відправку
  r.parts.push(pt.slice(3)); r.n++;
  if (!last) return;
  delete rx[type];
  const all = cat(...r.parts);
  if (type === 'K') {                               // відповідь керування: [номер 2][статус 1][JSON]
    const id = all[0] | (all[1] << 8), w = ctlW[id];
    if (w) { delete ctlW[id]; w({st: all[2], text: dec.decode(all.slice(3))}); }
    return;
  }
  const text = dec.decode(all);
  if (type === 'S') { try { state = JSON.parse(text); stateAt = Date.now(); updBar(); } catch (e) {} }
  else if (type === 'P' || type === 'T' || type === 'W') {
    try { localStorage.setItem('easun_pg_' + type, text); } catch (e) {}
    if (curPage === type && text !== shownHtml) render(type, text);
  }
  const w = waiters[type]; if (w) { delete waiters[type]; w(text); }
}
function waitFor(type, ms) {
  return new Promise((res, rej) => { const t = setTimeout(() => { delete waiters[type]; rej(new Error('timeout')); }, ms); waiters[type] = v => { clearTimeout(t); res(v); }; });
}

// Скрипт, що вставляється на початок сторінки ESP: її запити йдуть через міст, а не на сервер
const SHIM = '<script>(function(){var R=parent.RB;window.fetch=function(u,o){return R.fetch(String(u),o)};' +
  'document.addEventListener("click",function(e){var a=e.target.closest&&e.target.closest("a");if(!a)return;var h=a.getAttribute("href");' +
  'if(!h||h.charAt(0)!="/")return;e.preventDefault();R.nav(h)},true);' +
  'var s=document.createElement("style");s.textContent=(R.ck?"":"#bbtn{display:none!important}")+' +
  '"#wscan,#wsave,#wssid,#wpass,#wlist,#bscan,#blist,#bforget,#cnew,#cpin,#cpsave,#cpclr,#clen,#ofile,#obtn{display:none!important}";document.head.appendChild(s)})()<\/script>';

function render(type, html) {
  curPage = type; shownHtml = html;
  const i = html.indexOf('<head>');
  $('f').srcdoc = i >= 0 ? html.slice(0, i + 6) + SHIM + html.slice(i + 6) : SHIM + html;
  $('f').style.display = 'block'; $('msg').style.display = 'none';
}
async function openPage(type) {
  curPage = type;
  let cached = null;
  try { cached = localStorage.getItem('easun_pg_' + type); } catch (e) {}
  if (cached) render(type, cached);
  else showMsg(T.waiting, T.waitingP, true);
  req(type);                                        // свіжа версія (раптом оновилася прошивка)
}
// ── Керування за ПІН ──
let ck = null, ctlId = 1;
const ctlW = {};
async function deriveCk(pin) {
  const base = await crypto.subtle.importKey('raw', enc.encode(pin), 'PBKDF2', false, ['deriveBits']);
  const bits = await crypto.subtle.deriveBits({name: 'PBKDF2', salt: enc.encode('easun-pin:' + P.d), iterations: 20000, hash: 'SHA-256'}, base, 128);
  return new Uint8Array(bits);
}
async function setCk(raw) { ck = raw ? await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['encrypt', 'decrypt']) : null; RB.ck = !!ck; lockUi(); }
function ctl(method, path, body) {
  return new Promise(async (res, rej) => {
    if (!ck || !mq || !mq.up) { rej(new Error('nock')); return; }
    const id = ctlId = (ctlId % 65000) + 1, b = enc.encode(path), bd = enc.encode(body || '');
    const pt = new Uint8Array(12 + b.length + 1 + bd.length);
    pt[0] = 67;                                                     // 'C'
    new DataView(pt.buffer).setFloat64(1, Date.now(), true);         // little-endian, як читає ESP
    pt[9] = id & 255; pt[10] = id >> 8; pt[11] = method === 'P' ? 80 : 71;
    pt.set(b, 12); pt.set(bd, 13 + b.length);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = new Uint8Array(await crypto.subtle.encrypt({name: 'AES-GCM', iv}, ck, pt));
    const t = setTimeout(() => { delete ctlW[id]; rej(new Error('timeout')); }, 10000);
    ctlW[id] = v => { clearTimeout(t); res(v); };
    mq.pub('easun/' + P.d + '/q', cat(iv, ct));
  });
}
function lockUi() { const l = $('lock'); l.textContent = T.unlocked; l.style.display = ck ? 'block' : 'none'; }
$('lock').onclick = () => { if (!confirm(T.lockAsk)) return; try { localStorage.removeItem('easun_ck_' + P.d); } catch (e) {} setCk(null); if (curPage === 'W') openPage('P'); };
function askPin() {
  return new Promise(done => {
    const m = $('pin'), v = $('pv'), e = $('pe');
    $('pt').textContent = T.pinTitle; $('pp').textContent = T.pinText; $('prl').textContent = T.pinRemember; $('po').textContent = T.pinOk; $('pc').textContent = T.pinCancel;
    e.textContent = ''; v.value = ''; m.style.display = 'flex'; setTimeout(() => v.focus(), 50);
    const close = ok => { m.style.display = 'none'; done(ok); };
    $('pc').onclick = () => close(false);
    $('po').onclick = async () => {
      const p = v.value.trim();
      if (!/^[0-9]{4,8}$/.test(p)) { e.textContent = T.pinBad; return; }
      e.textContent = T.pinChecking; $('po').disabled = true;
      const raw = await deriveCk(p);
      await setCk(raw);
      try {
        const r = await ctl('G', '/api/cfg');
        if (r.st !== 200) throw new Error('st');
        if ($('pr').checked) try { localStorage.setItem('easun_ck_' + P.d, btoa(String.fromCharCode(...raw))); } catch (x) {}
        $('po').disabled = false; close(true);
      } catch (x) { await setCk(null); e.textContent = T.pinWrong; $('po').disabled = false; }
    };
    v.onkeydown = ev => { if (ev.key === 'Enter') $('po').click(); };
  });
}
const json = (o, st) => new Response(typeof o === 'string' ? o : JSON.stringify(o), {status: st || 200, headers: {'Content-Type': 'application/json'}});
RB.fetch = async (u, o) => {
  const path = u.replace(/^https?:\/\/[^/]+/, '').split('?')[0];
  const post = o && o.method && o.method.toUpperCase() !== 'GET';
  if (ck && (path === '/api/cfg' || (post && ['/api/sched', '/api/reboot', '/bms/pause', '/bms/resume'].includes(path)))) {
    const body = o && o.body != null ? String(o.body) : '';
    const r = await ctl(post ? 'P' : 'G', path, body);
    if (r.st !== 200) { toast(T.localOnly); return json({ok: false}, 403); }
    return new Response(r.text, {status: 200, headers: {'Content-Type': 'application/json'}});
  }
  if (post) { toast(ck ? T.localOnly : T.needPin); return json({ok: false}, 403); }
  if (path === '/api') {
    if (!state || Date.now() - stateAt > STATE_STALE_MS) {
      req('H');
      try { await waitFor('S', 6000); } catch (e) {}
    }
    if (!state || Date.now() - stateAt > STATE_STALE_MS) throw new Error('offline');
    return json(state);
  }
  if (path === '/api/stats') { const p = waitFor('A', 15000); req('A'); return json(await p); }
  if (path === '/api/hist') { const p = waitFor('G', 15000); req('G'); return json(await p); }
  throw new Error('not available');
};
RB.nav = h => {
  const path = h.split(/[?#]/)[0];
  if (path === '/') openPage('P');
  else if (path === '/stats') openPage('T');
  else if (path === '/settings') {
    if (state && !state.pin) { toast(T.pinNone); return; }
    if (ck) { openPage('W'); return; }
    askPin().then(ok => { if (ok) openPage('W'); });
  }
  else toast(T.localOnly);
};

function ago(ms) { const s = Math.round(ms / 1000); return s < 90 ? s + ' ' + T.sec : s < 5400 ? Math.round(s / 60) + ' ' + T.min : Math.round(s / 3600) + ' ' + T.hr; }
function updBar() {
  if (!mq) return;
  if (!mq.up) { bar(T.noNet, true); return; }
  if (state && Date.now() - stateAt > STATE_STALE_MS) { bar(T.offlineLong.replace('{t}', ago(Date.now() - stateAt)), true, diagText()); return; }
  if (!state && Date.now() - startAt > 12000) { bar(T.offline, true, diagText()); return; }
  bar('');
}
let startAt = Date.now();

async function start() {
  if (!P) { showMsg(T.noLink, T.noLinkP); return; }
  if (!window.crypto || !crypto.subtle) { showMsg(T.noCrypto, T.noCryptoP); return; }
  try { key = await crypto.subtle.importKey('raw', b64urlDec(P.k), 'AES-GCM', false, ['encrypt', 'decrypt']); }
  catch (e) { showMsg(T.noLink, T.noLinkP); return; }
  try { const sv = localStorage.getItem('easun_ck_' + P.d); if (sv) await setCk(Uint8Array.from(atob(sv), c => c.charCodeAt(0))); } catch (e) {}
  showMsg(T.connecting, T.connectingP, true);
  mq = new Mqtt(P.w, ['easun/' + P.d + '/r', 'easun/' + P.d + '/q'], onMsg, up => {
    updBar();
    if (up) { startAt = Date.now(); if (curPage) req(curPage); else openPage('P'); }
  });
  setInterval(() => { if (!document.hidden) req('H'); updBar(); }, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { mq.kick(); req('H'); } });
  setInterval(updBar, 3000);
}
start();
</script>
